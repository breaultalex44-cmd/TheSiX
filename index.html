<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Optimized viewport: prevents accidental zooming on Android when tapping inputs -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The SiX | Premium Ontario Tax Hub</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@300;400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #050505;
            --neon-magenta: #e81cff;
            --neon-cyan: #40c9ff;
            --gold: #d4af37;
            /* Optimized for Moto G Play: less transparency, less blur needed = higher FPS */
            --glass-bg: rgba(20, 20, 25, 0.85); 
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            /* Smoother scrolling on 90Hz Motorola displays */
            scroll-behavior: smooth; 
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            /* Padding for Android bottom navigation bar */
            padding-bottom: 40px; 
        }

        /* --- Hero Banner & Vibe --- */
        .hero {
            position: relative;
            height: 35vh; /* Reduced from 50vh for better mobile real estate */
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), var(--bg-color)),
                        url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=800&auto=format&fit=crop') center/cover;
            border-bottom: 2px solid var(--neon-magenta);
            box-shadow: 0 10px 40px rgba(232, 28, 255, 0.2);
        }

        .title-container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 0 15px;
        }

        h1.logo {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem; /* Scaled down for 720p 6.5" screen */
            color: #fff;
            text-shadow: 0 0 15px var(--neon-magenta);
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
            letter-spacing: 2px;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        /* --- Main Layout --- */
        .container {
            max-width: 1200px;
            margin: -30px auto 20px;
            padding: 0 15px;
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr; /* Default to mobile single column */
            gap: 20px;
        }

        /* Desktop override */
        @media (min-width: 900px) {
            .container { grid-template-columns: 1.5fr 1fr; }
            h1.logo { font-size: 5rem; }
            .hero { height: 50vh; }
        }

        /* --- Glassmorphism Cards --- */
        .glass-card {
            background: var(--glass-bg);
            /* Reduced blur from 16px to 8px to maintain 60/90fps on Moto G Play Snapdragon 680 */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            margin-bottom: 15px;
            font-size: 1.5rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 8px;
        }

        /* --- Inputs & Buttons --- */
        .input-group {
            margin-bottom: 15px;
            width: 100%;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 0.85rem;
        }

        /* Font size MUST be exactly 16px or higher to stop Android browsers from auto-zooming */
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: #fff;
            border-radius: 10px;
            font-size: 16px; 
            outline: none;
            transition: all 0.2s;
            appearance: none; /* Removes native styling on Android select box */
        }

        input:focus, select:focus {
            border-color: var(--neon-cyan);
            background: rgba(255, 255, 255, 0.12);
        }

        .calc-flex-container {
            display: flex;
            flex-direction: column; /* Stack vertically on Moto to ensure big tap targets */
            gap: 10px;
        }

        @media (min-width: 600px) {
            .calc-flex-container { flex-direction: row; }
        }

        .btn {
            background: linear-gradient(45deg, var(--neon-magenta), #9b00e8);
            color: white;
            border: none;
            padding: 16px 20px; /* Thicker for thumb taps */
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-family: 'Orbitron', sans-serif;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:active {
            transform: scale(0.98); /* Tactile feedback for mobile tap */
        }

        /* --- Oracle Search Results --- */
        #oracle-result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(0,0,0,0.6);
            border-left: 4px solid var(--neon-cyan);
            display: none;
        }

        .tax-tag {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: 10px;
        }
        .tag-exempt { background: rgba(0, 255, 100, 0.15); color: #00ff64; border: 1px solid #00ff64; }
        .tag-hst { background: rgba(255, 0, 100, 0.15); color: #ff0064; border: 1px solid #ff0064; }
        .tag-special { background: rgba(255, 200, 0, 0.15); color: #ffc800; border: 1px solid #ffc800; }

        /* --- Ledger & Cloud Sync --- */
        .ledger-list {
            list-style: none;
            max-height: 250px; /* Slightly shorter for 720x1600 screen */
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-magenta) transparent;
        }

        .ledger-item {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            border-left: 3px solid var(--gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ledger-item-left { max-width: 60%; }
        .ledger-item-right { text-align: right; font-size: 0.8rem; color: #aaa; }

        .cloud-sync-bar {
            background: rgba(64, 201, 255, 0.05);
            border: 1px solid rgba(64, 201, 255, 0.3);
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            font-size: 0.85rem;
        }

        /* Scrollbar styling for webkit */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--neon-magenta); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Hero Section -->
    <header class="hero">
        <div class="title-container">
            <h1 class="logo">The SiX</h1>
            <p class="subtitle">Ontario Shop Tax Oracle</p>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        
        <!-- Left Column: The Oracle -->
        <div class="glass-card">
            <h2><i class="fa-solid fa-magnifying-glass-chart"></i> The Oracle</h2>
            <p style="color: #aaa; margin-bottom: 15px; font-size: 0.85rem; line-height: 1.4;">
                Search a scenario (e.g. "six muffin bakery", "Wendys meal").
            </p>
            
            <div class="input-group">
                <input type="text" id="productSearch" placeholder="Describe the item..." autocomplete="off">
            </div>
            
            <button class="btn" onclick="analyzeTax()"><i class="fa-solid fa-bolt"></i> Analyze Product</button>

            <div id="oracle-result">
                <h3 id="res-title" style="color: var(--neon-cyan); margin-bottom: 8px; font-family: 'Orbitron', sans-serif; font-size: 1.1rem;"></h3>
                <p id="res-desc" style="color: #ddd; line-height: 1.4; font-size: 0.85rem;"></p>
                <div id="res-tag" class="tax-tag"></div>
            </div>

            <!-- Manual Calculator -->
            <h2 style="margin-top: 30px;"><i class="fa-solid fa-calculator"></i> Quick Compute</h2>
            <div class="calc-flex-container">
                <div class="input-group">
                    <label>Subtotal ($)</label>
                    <input type="number" id="calc-amount" placeholder="0.00" step="0.01" inputmode="decimal">
                </div>
                <div class="input-group">
                    <label>Tax Rate</label>
                    <select id="calc-rate">
                        <option value="0.13" style="color: black;">13% HST (Standard)</option>
                        <option value="0.05" style="color: black;">5% GST (Prepared < $4)</option>
                        <option value="0" style="color: black;">0% (Exempt)</option>
                    </select>
                </div>
            </div>
            <button class="btn" onclick="calculateAndSave()" style="background: linear-gradient(45deg, var(--gold), #997300); color: #000;">
                <i class="fa-solid fa-plus"></i> Calculate & Log
            </button>
        </div>

        <!-- Right Column: The Ledger -->
        <div class="glass-card">
            <h2><i class="fa-solid fa-book-journal-whills"></i> The Ledger</h2>
            
            <ul class="ledger-list" id="ledger-list">
                <!-- Items populated by JS -->
            </ul>

            <div class="cloud-sync-bar">
                <i class="fa-solid fa-cloud" style="color: var(--neon-cyan);"></i> 
                <span id="sync-status">Sync ID: <strong style="color: var(--neon-cyan)" id="device-id"></strong></span>
                <button onclick="promptRestore()" style="background: none; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 8px; border-radius: 5px; margin-top: 10px; cursor: pointer; width: 100%; font-weight: bold;">
                    <i class="fa-solid fa-rotate"></i> Import Device ID
                </button>
            </div>
        </div>

    </div>

    <script>
        // --- 1. THE ORACLE TAX ENGINE ---
        const taxRules = [
            {
                regex: /(6|six|7|seven|8|eight|9|nine|10|ten|11|eleven|12|dozen|multiple|box of).*(muffin|donut|doughnut|cookie|croissant|pastry|tart)/i,
                title: "Basic Groceries (Zero-Rated)",
                desc: "Purchasing 6+ sweet baked goods categorizes them as basic groceries (100% tax exempt).",
                tagClass: "tag-exempt", tagName: "0% TAX (EXEMPT)", autoRate: 0
            },
            {
                regex: /(1|one|single|2|two|3|three|4|four|5|five).*(muffin|donut|doughnut|cookie|croissant|pastry|tart)/i,
                title: "Snack Food",
                desc: "Fewer than 6 sweet baked goods are classified as snack foods (13% HST).",
                tagClass: "tag-hst", tagName: "13% HST", autoRate: 0.13
            },
            {
                regex: /(wendys|mcdonalds|burger king|tim hortons|subway|restaurant|fast food|takeout|take out|combo)/i,
                title: "Prepared Food & Beverages",
                desc: "Meals ≤ $4.00 pay 5% GST. Meals > $4.00 pay 13% HST.",
                tagClass: "tag-special", tagName: "5% (≤ $4) OR 13% (> $4)", autoRate: 0.13
            },
            {
                regex: /(grocery|loblaws|metro|milk|egg|bread|vegetable|fruit|meat|cheese|water)/i,
                title: "Basic Groceries",
                desc: "Unprepared basic groceries are zero-rated.",
                tagClass: "tag-exempt", tagName: "0% TAX (EXEMPT)", autoRate: 0
            },
            {
                regex: /(book|textbook|novel)/i,
                title: "Printed Books",
                desc: "Printed books are exempt from the 8% Ontario portion.",
                tagClass: "tag-special", tagName: "5% GST ONLY", autoRate: 0.05
            },
            {
                regex: /(child|kid|baby).*(cloth|shoe|shirt|pant|jacket)/i,
                title: "Children's Clothing",
                desc: "Qualifies for an Ontario POS rebate. Only 5% GST applies.",
                tagClass: "tag-special", tagName: "5% GST ONLY", autoRate: 0.05
            }
        ];

        function analyzeTax() {
            const input = document.getElementById('productSearch').value;
            const resDiv = document.getElementById('oracle-result');
            const resTitle = document.getElementById('res-title');
            const resDesc = document.getElementById('res-desc');
            const resTag = document.getElementById('res-tag');
            const calcRateSelect = document.getElementById('calc-rate');

            if(!input.trim()) return;

            // Hide keyboard on Android after search
            document.getElementById('productSearch').blur(); 

            let matchedRule = null;
            for(let rule of taxRules) {
                if(rule.regex.test(input)) { matchedRule = rule; break; }
            }

            if(!matchedRule) {
                matchedRule = {
                    title: "Standard Goods & Services",
                    desc: "Most goods and services in Ontario fall under the standard HST rate.",
                    tagClass: "tag-hst", tagName: "13% HST", autoRate: 0.13
                };
            }

            resTitle.innerText = matchedRule.title;
            resDesc.innerText = matchedRule.desc;
            resTag.className = `tax-tag ${matchedRule.tagClass}`;
            resTag.innerText = matchedRule.tagName;
            calcRateSelect.value = matchedRule.autoRate;
            resDiv.style.display = 'block';
        }

        // --- 2. CLOUD SYNC & LEDGER ---
        let ledgerData = [];
        let syncId = localStorage.getItem('theSix_SyncID');

        if(!syncId) {
            syncId = 'SIX-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            localStorage.setItem('theSix_SyncID', syncId);
        }
        document.getElementById('device-id').innerText = syncId;

        function init() {
            const saved = localStorage.getItem(`theSix_Ledger_${syncId}`);
            if(saved) {
                ledgerData = JSON.parse(saved);
                renderLedger();
            }
        }

        function calculateAndSave() {
            const amtInput = document.getElementById('calc-amount');
            const rate = parseFloat(document.getElementById('calc-rate').value);
            const subtotal = parseFloat(amtInput.value);

            if(isNaN(subtotal) || subtotal <= 0) {
                alert("Enter a valid amount.");
                return;
            }

            amtInput.blur(); // Hide keyboard

            let actualRate = rate;
            let note = "";
            const query = document.getElementById('productSearch').value;
            
            if(rate === 0.13 && /(wendys|mcdonalds|restaurant)/i.test(query) && subtotal <= 4.00) {
                actualRate = 0.05;
                note = "(Auto: Meals ≤ $4 are 5%)";
            }

            const tax = subtotal * actualRate;
            const total = subtotal + tax;

            const entry = {
                id: Date.now(),
                date: new Date().toLocaleDateString(undefined, {month:'short', day:'numeric'}) + " " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                query: query || "Manual Log",
                subtotal: subtotal.toFixed(2),
                tax: tax.toFixed(2),
                total: total.toFixed(2),
                rateStr: actualRate === 0 ? "0%" : actualRate === 0.05 ? "5%" : "13%",
                note: note
            };

            ledgerData.unshift(entry);
            saveToCloud();
            renderLedger();
        }

        function renderLedger() {
            const list = document.getElementById('ledger-list');
            list.innerHTML = '';

            if(ledgerData.length === 0) {
                list.innerHTML = '<li style="color: #666; text-align: center; padding: 20px; font-size: 0.9rem;">No records. Calculate something above.</li>';
                return;
            }

            ledgerData.forEach(item => {
                const li = document.createElement('li');
                li.className = 'ledger-item';
                li.innerHTML = `
                    <div class="ledger-item-left">
                        <strong style="color: #fff; font-family: 'Orbitron', sans-serif; font-size: 1.1rem;">$${item.total}</strong>
                        <div style="font-size: 0.8rem; color: var(--neon-cyan); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${item.query}</div>
                        <div style="font-size: 0.7rem; color: #888;">${item.date}</div>
                    </div>
                    <div class="ledger-item-right">
                        Sub: $${item.subtotal}<br>
                        Tax: $${item.tax} (${item.rateStr})<br>
                        <span style="color: var(--gold); font-size: 0.65rem;">${item.note}</span>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function saveToCloud() {
            localStorage.setItem(`theSix_Ledger_${syncId}`, JSON.stringify(ledgerData));
        }

        function promptRestore() {
            const enteredId = prompt("Enter 10-character Device ID (e.g., SIX-XXXXXX):");
            if(enteredId && enteredId.startsWith('SIX-')) {
                syncId = enteredId.toUpperCase();
                localStorage.setItem('theSix_SyncID', syncId);
                document.getElementById('device-id').innerText = syncId;
                
                const saved = localStorage.getItem(`theSix_Ledger_${syncId}`);
                if(saved) {
                    ledgerData = JSON.parse(saved);
                    alert("Ledger synchronized.");
                } else {
                    ledgerData = [];
                    alert("Connected. No history found.");
                }
                renderLedger();
            } else if (enteredId) {
                alert("Invalid Sync ID.");
            }
        }

        document.getElementById('productSearch').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') analyzeTax();
        });

        init();
    </script>
</body>
</html>
